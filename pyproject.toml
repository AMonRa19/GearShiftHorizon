[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gearshift-horizon"
version = "0.20.0"
description = "Python-based adaptive telemetry and transmission controller for Forza Horizon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "ruff>=0.5", "pyinstaller>=6.8"]

[project.scripts]
gearshift-horizon = "gearshift.app:main"

[tool.setuptools.packages.find]
include = ["gearshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
