name: Python CI

on:
  push:
    branches: ["release/v0.20.0"]
  pull_request:
    branches: ["release/v0.20.0"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --windowed --name GearShiftHorizon gearshift/app.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GearShiftHorizon-v0.20.0-python-windows
          path: dist/GearShiftHorizon/
