name: Rust CI
on:
  push:
    branches: ["release/v0.19.0"]
  pull_request:
    branches: ["release/v0.19.0"]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets --verbose
      - name: Build release
        run: cargo build --release --verbose
