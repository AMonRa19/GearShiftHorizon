name: GearShiftHorizon Python Windows

on:
  push:
    branches:
      - release/v0.20.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name GearShiftHorizon --collect-all PySide6 --collect-all shiboken6 gearshift_launcher.py

      - name: Package executable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/GearShiftHorizon" -DestinationPath "dist/GearShiftHorizon-v0.20.0-python-windows.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GearShiftHorizon-v0.20.0-python-windows
          path: dist/GearShiftHorizon-v0.20.0-python-windows.zip
          if-no-files-found: error
          retention-days: 14
