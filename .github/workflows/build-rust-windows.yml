name: GearShiftHorizon Rust Windows

on:
  push:
    branches:
      - release/v0.21.0-rust-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --all-targets --verbose

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package/GearShiftHorizon" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/fh6-virtual-tcu-rust.exe" "package/GearShiftHorizon/GearShiftHorizon.exe"
          @'
          GearShiftHorizon v0.21.0 Rust Core
          
          1. Распакуйте всю папку GearShiftHorizon.
          2. Запустите GearShiftHorizon.exe.
          3. В Forza Horizon 6 включите Data Out / UDP и укажите порт 5555.
          4. В программе сначала проверьте получение телеметрии, затем включите автоматическое переключение.
          5. Кнопка «HUD поверх игры» открывает компактный оверлей.
          
          Файлы tcu_config.json и tcu_calibration.json создаются рядом с программой.
          Не удаляйте их, если хотите сохранить настройки и обучение автомобилей.
          '@ | Set-Content "package/GearShiftHorizon/README-RU.txt" -Encoding UTF8
          Compress-Archive -Path "package/GearShiftHorizon" -DestinationPath "GearShiftHorizon-v0.21.0-rust-windows.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GearShiftHorizon-v0.21.0-rust-windows
          path: GearShiftHorizon-v0.21.0-rust-windows.zip
          if-no-files-found: error
          retention-days: 30
